name: Android CI Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.2
          fi

      - name: Print Debug Keystore SHA-1 and SHA-256
        run: |
          echo "===== DEBUG KEYSTORE FINGERPRINTS ====="
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android || echo "Debug keystore not found yet, will be created on first build."
          echo "========================================"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Print Debug Keystore SHA-1 and SHA-256 (after build)
        run: |
          echo "===== DEBUG KEYSTORE FINGERPRINTS (POST-BUILD) ====="
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android
          echo "======================================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
